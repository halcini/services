<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a3a"/>
      <stop offset="100%" stop-color="#ff5967"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0d101a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff2a3a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="400" rx="16" fill="url(#bgGrad)" stroke="#222838" stroke-width="1.5"/>

  <!-- Grid Overlay lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="320" x2="960" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/>
  </g>

  <!-- Header / Badge -->
  <g transform="translate(32, 28)">
    <rect width="180" height="24" rx="12" fill="rgba(255,42,58,0.12)" stroke="#ff2a3a" stroke-width="1"/>
    <text x="90" y="16" fill="#ff4d5a" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">PIPELINE ARCHITECTURE</text>
    <text x="200" y="17" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Search Ingestion &amp; Knowledge Indexation</text>
  </g>

  <!-- Node 1: Crawler & Bot Ingestion -->
  <g transform="translate(40, 85)">
    <rect width="190" height="265" rx="12" fill="url(#cardGrad)" stroke="#252b3d" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="4" rx="2" fill="#ff2a3a"/>
    <circle cx="28" cy="30" r="14" fill="rgba(255,42,58,0.15)"/>
    <text x="28" y="35" fill="#ff2a3a" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">01</text>
    <text x="52" y="27" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Crawl Ingestion</text>
    <text x="52" y="42" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Googlebot &amp; WRS</text>

    <line x1="16" y1="62" x2="174" y2="62" stroke="#1e2433"/>

    <!-- Content List -->
    <g transform="translate(16, 80)">
      <rect width="158" height="34" rx="6" fill="#090b10" stroke="#1a1e2b"/>
      <text x="10" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">robots.txt / Cluster</text>
      <text x="10" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">✓ Zero Crawl Traps</text>
    </g>

    <g transform="translate(16, 124)">
      <rect width="158" height="34" rx="6" fill="#090b10" stroke="#1a1e2b"/>
      <text x="10" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Sitemap XML Tier</text>
      <text x="10" y="28" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Dynamic Partitioning</text>
    </g>

    <g transform="translate(16, 168)">
      <rect width="158" height="34" rx="6" fill="rgba(255,42,58,0.06)" stroke="rgba(255,42,58,0.2)"/>
      <text x="10" y="16" fill="#ff4d5a" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">HTTP 200 / Edge 301</text>
      <text x="10" y="28" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">Direct Edge Handshake</text>
    </g>
  </g>

  <!-- Connection 1 -> 2 -->
  <path d="M 230 217 L 270 217" fill="none" stroke="#ff2a3a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- Node 2: Edge Delivery & Core Web Vitals -->
  <g transform="translate(275, 85)">
    <rect width="190" height="265" rx="12" fill="url(#cardGrad)" stroke="#252b3d" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="4" rx="2" fill="#ff2a3a"/>
    <circle cx="28" cy="30" r="14" fill="rgba(255,42,58,0.15)"/>
    <text x="28" y="35" fill="#ff2a3a" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">02</text>
    <text x="52" y="27" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Edge &amp; CWV Speed</text>
    <text x="52" y="42" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Sub-0.8s Rendering</text>

    <line x1="16" y1="62" x2="174" y2="62" stroke="#1e2433"/>

    <g transform="translate(16, 80)">
      <rect width="158" height="34" rx="6" fill="#090b10" stroke="#1a1e2b"/>
      <text x="10" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">TTFB Delivery</text>
      <text x="10" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">&lt; 48ms Edge Cache</text>
    </g>

    <g transform="translate(16, 124)">
      <rect width="158" height="34" rx="6" fill="#090b10" stroke="#1a1e2b"/>
      <text x="10" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Largest Paint (LCP)</text>
      <text x="10" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">0.74s (Optimal Pass)</text>
    </g>

    <g transform="translate(16, 168)">
      <rect width="158" height="34" rx="6" fill="#090b10" stroke="#1a1e2b"/>
      <text x="10" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Interaction (INP)</text>
      <text x="10" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">28ms Zero Delay</text>
    </g>

    <g transform="translate(16, 212)">
      <rect width="158" height="34" rx="6" fill="#090b10" stroke="#1a1e2b"/>
      <text x="10" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Layout Shift (CLS)</text>
      <text x="10" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">0.000 Rock Solid</text>
    </g>
  </g>

  <!-- Connection 2 -> 3 -->
  <path d="M 465 217 L 505 217" fill="none" stroke="#ff2a3a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- Node 3: JavaScript SSR & Hydration -->
  <g transform="translate(510, 85)">
    <rect width="190" height="265" rx="12" fill="url(#cardGrad)" stroke="#252b3d" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="4" rx="2" fill="#ff2a3a"/>
    <circle cx="28" cy="30" r="14" fill="rgba(255,42,58,0.15)"/>
    <text x="28" y="35" fill="#ff2a3a" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">03</text>
    <text x="52" y="27" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Javascript SEO</text>
    <text x="52" y="42" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">DOM Tree Ingestion</text>

    <line x1="16" y1="62" x2="174" y2="62" stroke="#1e2433"/>

    <g transform="translate(16, 80)">
      <rect width="158" height="34" rx="6" fill="#090b10" stroke="#1a1e2b"/>
      <text x="10" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Server Render (SSR)</text>
      <text x="10" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">Hydration Ready DOM</text>
    </g>

    <g transform="translate(16, 124)">
      <rect width="158" height="34" rx="6" fill="#090b10" stroke="#1a1e2b"/>
      <text x="10" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Canonical Self-Ref</text>
      <text x="10" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">Strict Clean URLs</text>
    </g>
  </g>

  <!-- Connection 3 -> 4 -->
  <path d="M 700 217 L 740 217" fill="none" stroke="#ff2a3a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- Node 4: Schema.org Knowledge Graph -->
  <g transform="translate(745, 85)">
    <rect width="175" height="265" rx="12" fill="url(#cardGrad)" stroke="#252b3d" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="4" rx="2" fill="#ff2a3a"/>
    <circle cx="28" cy="30" r="14" fill="rgba(255,42,58,0.15)"/>
    <text x="28" y="35" fill="#ff2a3a" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">04</text>
    <text x="52" y="27" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Schema Graph</text>
    <text x="52" y="42" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">AI &amp; Entity Search</text>

    <line x1="16" y1="62" x2="159" y2="62" stroke="#1e2433"/>

    <g transform="translate(14, 80)">
      <rect width="147" height="34" rx="6" fill="#090b10" stroke="#1a1e2b"/>
      <text x="8" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">JSON-LD Entity</text>
      <text x="8" y="28" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9">@graph Linked Nodes</text>
    </g>

    <g transform="translate(14, 124)">
      <rect width="147" height="34" rx="6" fill="#090b10" stroke="#1a1e2b"/>
      <text x="8" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Rich Snippets</text>
      <text x="8" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">FAQ &amp; TechArticle</text>
    </g>

    <g transform="translate(14, 168)">
      <rect width="147" height="34" rx="6" fill="#090b10" stroke="#1a1e2b"/>
      <text x="8" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Google Knowledge</text>
      <text x="8" y="28" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9">Entity Brand Matrix</text>
    </g>
  </g>
</svg>

